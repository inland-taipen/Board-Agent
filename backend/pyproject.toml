[project]
name = "boardlens"
version = "0.1.0"
description = "BoardLens AI - Board Intelligence Agent (BRD 01, STAIR Digital)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "cryptography>=43",
    "pyjwt>=2.9",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
gemini = ["google-genai>=1.0"]
groq = ["groq>=0.11"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "pypdf>=5.0", "ruff>=0.7"]

[project.scripts]
boardlens = "boardlens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boardlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "S", "RUF"]
ignore = [
    # FastAPI's dependency-injection idiom is a call in a default argument.
    "B008",
    # Line length is a formatter concern, and prompt text does not wrap well.
    "E501",
    # Uploaded board packs are parsed by third-party libraries; a broad except
    # around a parser is deliberate and always reports the file to the operator.
    "S110",
    "S112",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use hardcoded fixture passwords, and import shared fixtures.
"tests/*" = ["S101", "S105", "S106", "S107", "E402"]
"scripts/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Render Blueprint for BoardLens — FREE TIER.
#
# Nothing here contains a secret: every sensitive value is marked `sync: false`,
# which makes Render prompt for it in the dashboard rather than reading it from
# version control.
#
# ---------------------------------------------------------------------------
# WHAT THE FREE TIER MEANS HERE — read this before showing it to anyone.
#
# Free web services have an ephemeral filesystem and cannot attach a disk, and
# they sleep after 15 minutes without traffic. When the service wakes, the
# database, user accounts, uploaded board packs, retrieval indexes and generated
# briefings are all gone.
#
# In practice:
#   WORKS  - a live session. The service stays warm while it is being used, so
#            sign in, upload, generate, review and export all behave normally.
#   WORKS  - signing in after a sleep. The bootstrap administrator below is
#            recreated on every cold start, so the login always exists.
#   FAILS  - coming back later. Anything uploaded in a previous session is gone,
#            as is anyone added through the People screen.
#   FAILS  - a briefing running when the service sleeps. Generation is in-process
#            and takes ~90 seconds; it survives only while traffic keeps the
#            service awake, which an active user does.
#
# TO MAKE IT PERMANENT, three changes (~$9.50/month):
#   1. plan: starter
#   2. uncomment the `disk:` block
#   3. redeploy
# Data then survives restarts. See deploy/RENDER.md.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: boardlens
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Closest Render region to India.
    region: singapore

    # Measured: 87 MB idle, 95 MB while parsing and encrypting a four-document
    # pack — comfortably inside free tier's 512 MB. Memory is not the
    # constraint on the free plan; storage is.
    plan: free

    healthCheckPath: /health

    # Persistent storage. Requires a paid instance - uncommenting this on the
    # free plan makes the deploy fail rather than silently ignoring it.
    # disk:
    #   name: boardlens-data
    #   mountPath: /data
    #   sizeGB: 10

    envVars:
      # --- entered once in the dashboard, never committed ------------------
      - key: GEMINI_API_KEY
        sync: false

      # python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # On the free tier this only protects packs within a single session,
      # since the filesystem does not survive a sleep. It still matters: set a
      # real one, and on a paid plan never change it - doing so makes every
      # already-uploaded pack permanently undecryptable.
      - key: BOARDLENS_ENCRYPTION_KEY
        sync: false

      # python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: BOARDLENS_JWT_SECRET
        sync: false

      # Recreated on every cold start, so these are the credentials that always
      # work. Anyone added through the People screen is lost when the service
      # sleeps - on the free tier, share these rather than creating accounts.
      - key: BOARDLENS_BOOTSTRAP_EMAIL
        sync: false
      - key: BOARDLENS_BOOTSTRAP_PASSWORD
        sync: false

      # --- safe in version control -----------------------------------------
      # Pinned rather than auto-detected: with auto, adding an unrelated key to
      # the environment would silently change which model writes the briefing.
      - key: BOARDLENS_PROVIDER
        value: gemini
      - key: BOARDLENS_GEMINI_MODEL
        value: gemini-3.7-flash

      # The Dockerfile creates and owns /data, so this works with or without a
      # disk attached. Without one it is simply ephemeral.
      - key: BOARDLENS_DATA_DIR
        value: /data

      - key: BOARDLENS_WEB_DIR
        value: /app/frontend/dist

      - key: BOARDLENS_MAX_UPLOAD_MB
        value: "200"
